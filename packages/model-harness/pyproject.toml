[project]
name = "artifice-model-harness"
version = "0.4.0"
description = "Shared BYOM connector and schema-validated call surface for Ollama, LM Studio, and generic OpenAI-compatible endpoints."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]
authors = [
    {name = "Maurice J. Casey"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "LLM",
    "structured output",
    "schema validation",
    "BYOM",
    "OpenAI-compatible",
    "Ollama",
]

[project.urls]
Homepage = "https://github.com/Muggwoffin/artifice-suite"
Repository = "https://github.com/Muggwoffin/artifice-suite"
Issues = "https://github.com/Muggwoffin/artifice-suite/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_harness"]

# pytest-httpx (used by tests/test_openai_adapter.py) is declared in the
# *root* pyproject.toml because `uv sync --group dev` installs only the
# root's dev group, not any member package's.  This section is left empty
# intentionally — adding a dependency here would silently do nothing in CI.
[dependency-groups]
dev = []

# The live_smoke guard is declared here AND in the root pyproject.toml,
# deliberately.  pytest selects exactly one config file (from the rootdir it
# computes) — it does not merge them.  This section is what makes the
# package-scoped invocation work (`uv run pytest packages/model-harness`); the
# root copy covers repo-root invocations.  Change the two sections together.
[tool.pytest.ini_options]
markers = [
    "live_smoke: live smoke test requiring a running Ollama server (run with --live-smoke)",
]
addopts = "-m 'not live_smoke'"
