[project]
name = "artifice-shared-ui"
version = "0.4.0"
description = "Canonical design tokens, web fonts, and shared UI assets for the Artifice Suite"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "platformdirs>=4.0.0",
    "uvicorn[standard]>=0.20",
]
authors = [
    {name = "Maurice J. Casey"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "design tokens",
    "web fonts",
    "UI assets",
    "typography",
]

[project.urls]
Homepage = "https://github.com/Muggwoffin/artifice-suite"
Repository = "https://github.com/Muggwoffin/artifice-suite"
Issues = "https://github.com/Muggwoffin/artifice-suite/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_ui"]
include = ["shared_ui/assets/**", "shared_ui/templates/**/*.html"]
