[project]
name = "artifice-secure-io"
version = "0.4.0"
description = "OS-appropriate access controls for secret-bearing files in the Artifice Suite"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []
authors = [
    {name = "Maurice J. Casey"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "file permissions",
    "secrets management",
    "access control",
    "local-first",
    "windows-security",
]

[project.urls]
Homepage = "https://github.com/Muggwoffin/artifice-suite"
Repository = "https://github.com/Muggwoffin/artifice-suite"
Issues = "https://github.com/Muggwoffin/artifice-suite/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_io"]
