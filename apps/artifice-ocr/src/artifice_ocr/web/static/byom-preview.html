   Dev-only preview of the shared BYOM onboarding screen (packages/shared-ui
   /assets/byom.css, byom.js). Served only by GET /byom-preview when
   ARTIFICE_DEV_PREVIEW=1 — see web/server.py. Never linked from index.html.

   Exercises the real byom.js code paths against fixture data injected by
   the server (__FIXTURE_JSON__ below) via a `fetchImpl` override, rather
   than against the real /api/byom/* routes, which do not exist yet
   (Step 4). The fake transport below matches the exact contract byom.js
   expects of any fetchImpl: a function returning a Promise that resolves
   to the *parsed* JSON body.

   Two orthogonal query params: `state` (detecting/not-found/found/test-ok/
   test-fail/advanced) picks the detect+test scenario, unchanged from
   before; `app` (artifice-ocr/artifice-draft/artifice-graph/
   artifice-transcribe) picks which app's GET /api/byom/state payload is
   served — see web/server.py's byom_preview() route for how both get
   HTML- and JS-escaped before being substituted in here.
  -->

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYOM preview — __APP_HTML__</title>

<!-- Link order matters: fonts/tokens, then the host app's own app.css
     (supplies --accent/--accent-deep/--accent-wash by cascade — byom.css
     declares none of the three), then byom.css. -->
<link rel="stylesheet" href="/shared/fonts.css?v=__ASSET_V__">
<link rel="stylesheet" href="/shared/tokens.css?v=__ASSET_V__">
<link rel="stylesheet" href="/static/css/app.css?v=__ASSET_V__">
<link rel="stylesheet" href="/shared/byom.css?v=__ASSET_V__">

<style>
  /* Preview-harness chrome only — not part of the BYOM screen itself. */
  body { margin: 0; background: var(--paper); min-height: 100vh; }
  .preview-bar {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--ink-faint);
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--rule);
  }
  .preview-bar a { color: var(--accent-deep); margin-right: var(--space-5); }
</style>
</head>
<body>

<div class="preview-bar">
  BYOM preview &middot; app=<strong id="previewAppLabel">__APP_HTML__</strong> &middot;
  <a href="/byom-preview?app=artifice-ocr&amp;state=__STATE_HTML__">ocr</a>
  <a href="/byom-preview?app=artifice-draft&amp;state=__STATE_HTML__">draft</a>
  <a href="/byom-preview?app=artifice-graph&amp;state=__STATE_HTML__">graph</a>
  <a href="/byom-preview?app=artifice-transcribe&amp;state=__STATE_HTML__">transcribe</a>
</div>
<div class="preview-bar">
  state=<strong id="previewStateLabel">__STATE_HTML__</strong> &middot;
  <a href="/byom-preview?app=__APP_HTML__&amp;state=detecting">detecting</a>
  <a href="/byom-preview?app=__APP_HTML__&amp;state=not-found">not-found</a>
  <a href="/byom-preview?app=__APP_HTML__&amp;state=found">found</a>
  <a href="/byom-preview?app=__APP_HTML__&amp;state=test-ok">test-ok</a>
  <a href="/byom-preview?app=__APP_HTML__&amp;state=test-fail">test-fail</a>
  <a href="/byom-preview?app=__APP_HTML__&amp;state=advanced">advanced</a>
</div>

<script src="/shared/byom.js?v=__ASSET_V__"></script>
<script>
(function () {
  "use strict";
  var STATE_NAME = __STATE_JS__;
  var APP_SLUG = __APP_JS__;
  var APP_NAME = __APP_NAME_JS__;
  var FIXTURE = __FIXTURE_JSON__;
  document.title = "BYOM preview — " + APP_NAME;
  window.console && window.console.log("[byom-preview] app=" + APP_SLUG + " state=" + STATE_NAME, FIXTURE);

  // Fake transport matching byom.js's fetchImpl contract exactly: takes
  // (url, opts), returns a Promise resolving to the already-parsed JSON
  // body. GET /api/byom/detect never resolves in the "detecting" scenario
  // so the reviewer can see the in-progress state rather than it flashing
  // past. /api/byom/test-embedding is graph-only in the real contract, but
  // answering it unconditionally here is harmless — byom.js only calls it
  // when FIXTURE.state.embedding is present.
  function fakeFetch(url, opts) {
    opts = opts || {};
    if (url === "/api/byom/state") {
      return Promise.resolve(FIXTURE.state);
    }
    if (url === "/api/byom/detect") {
      if (FIXTURE.detect === null) {
        return new Promise(function () { /* never resolves — "detecting" stays visible */ });
      }
      return Promise.resolve(FIXTURE.detect);
    }
    if (url === "/api/byom/test") {
      return Promise.resolve(FIXTURE.test);
    }
    if (url === "/api/byom/test-embedding") {
      return Promise.resolve(FIXTURE.testEmbedding);
    }
    return Promise.reject(new Error("no fixture for " + url));
  }

  var byom = window.ArtificeByom.create({
    appName: APP_NAME,
    fetchImpl: fakeFetch,
    onConfigured: function (result) {
      window.console && window.console.log("[byom-preview] onConfigured:", result);
    }
  });

  byom.open({
    initialTab: FIXTURE.initialTab || undefined,
    autoTest: FIXTURE.autoTest || undefined
  });
})();
</script>
</body>
</html>
